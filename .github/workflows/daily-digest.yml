name: Daily Digest

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch sources
        run: python src/fetch.py

      - name: Summarize items
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/summarize.py

      - name: Build digest
        run: python src/build_digest.py

      - name: Commit digest
        run: |
          git config user.name "digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add digests/
          git commit -m "Add digest for $(date +'%Y-%m-%d')" || echo "No changes"
          git push
